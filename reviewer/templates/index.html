<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - [Your Application Name]</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }


        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            max-width: 720px;
            width: 100%;
        }


        h1 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 2.2em;
            font-weight: 600;
        }


        p.intro-text {
            font-size: 1.1em;
            color: #555e68;
            margin-bottom: 35px;
            line-height: 1.6;
        }


        .options {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }


        .button {
            display: block;
            padding: 16px 20px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 500;
            transition: background-color 0.2s ease-in-out, transform 0.2s ease-in-out;
            border: none;
            cursor: pointer;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        

        .button strong {
            display: block;
            font-size: 1.05em;
            margin-bottom: 4px;
        }

        .button small {
            font-weight: normal;
            font-size: 0.8em;
            opacity: 0.9;
            display: block;
        }


        .button-primary {
            background-color: rgb(95, 111, 184);
            color: white;
        }
        .button-primary:hover { background-color: rgb(95, 111, 184); }
        .button-primary small { color: #e6f0f8; }

        .button-info {
            background-color: #d9534f;
            color: white;
        }
        .button-info:hover { background-color: #d9534f; }
        .button-info small { color: #e8f4fb; }

        .button-danger {
            background-color: #d9534f;
            color: white;
        }
        .button-danger:hover { background-color: #d9534f; }
        .button-danger small { color: #fdecea; }

        body {
            opacity: 0;
            visibility: hidden;
        }

        body.fade-in {
            visibility: visible;
            opacity: 1;
            transition: opacity 0.15s ease-in;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Reviewing:</h1>
        <p class="intro-text">{{ parquet_path }}</p>
        <div class="options">
            <a href="{{ url_for('start', method='overwrite') }}" class="button button-danger">
                <strong>Overwrite review</strong>
                <small>Start/redo from 1st entry.</small>
            </a>
            <a href="{{ url_for('start', method='continue') }}" class="button button-primary">
                <strong>Continue review</strong>
                <small>From 1st unreviewed entry.</small>
            </a>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                document.body.classList.add("fade-in");
            }, 50);
        });
    </script>
</body>
</html>
